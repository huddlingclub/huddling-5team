<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>허들링 5팀</title>
  <style>
    :root { --bg: #f4f6fb; --ink: #14171f; --muted: #6b7280; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1117; --ink: #eef0f5; --muted: #9aa1b0; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    main { text-align: center; padding: 24px 16px; }
    h1 { font-size: clamp(28px, 7vw, 44px); margin: 0 0 8px; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>허들링 5팀</h1>
    <p>11/14 협업 실험실 · 배포 연결 확인용 첫 페이지</p>
  </main>
</body>
</html>
